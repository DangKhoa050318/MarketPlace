spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:marketplace_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1000ms
      timeout: 1000ms

  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

jwt:
  # REQUIRED. No default on purpose — set a unique 256-bit secret per environment (see .env.example).
  # The app fails fast if JWT_SECRET is unset, so a shared/hardcoded key can never leak via the repo.
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.training.marketplace: DEBUG

marketplace:
  payment:
    # Safe default: orders stay PENDING and Rabbit retries/DLQs until a real provider adapter is configured.
    provider: ${PAYMENT_PROVIDER:disabled}
  features:
    review-qa: ${FEATURE_REVIEW_QA_ENABLED:true}
    promotions: ${FEATURE_PROMOTIONS_ENABLED:true}
    recommendations: ${FEATURE_RECOMMENDATIONS_ENABLED:true}
    journey-analytics: ${FEATURE_JOURNEY_ANALYTICS_ENABLED:true}
  analytics:
    cache-ttl: ${ANALYTICS_CACHE_TTL:5m}
  recommendation:
    best-seller-lookback: ${RECOMMENDATION_BEST_SELLER_LOOKBACK:30d}
    valid-order-statuses: ${RECOMMENDATION_VALID_ORDER_STATUSES:CONFIRMED,PROCESSING,SHIPPED,DELIVERED}
    co-viewed-lookback: ${RECOMMENDATION_CO_VIEWED_LOOKBACK:90d}
    min-co-viewed-occurrences: ${RECOMMENDATION_MIN_CO_VIEWED_OCCURRENCES:2}
    co-purchased-lookback: ${RECOMMENDATION_CO_PURCHASED_LOOKBACK:90d}
    min-co-purchased-occurrences: ${RECOMMENDATION_MIN_CO_PURCHASED_OCCURRENCES:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
