spring:
  # Dev convenience: load the local, git-ignored backend/.env (properties format) so secrets like
  # JWT_SECRET stay out of source and git. 'optional:' means prod/CI can supply real env vars instead.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:marketplace_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1000ms
      timeout: 1000ms

  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:marketplace_refresh}
    # Local HTTP demo uses false. Set true whenever the frontend is served over HTTPS.
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    path: /api/v1/auth
    max-age: ${AUTH_REFRESH_COOKIE_MAX_AGE:7d}

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

marketplace:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
  payment:
    provider: ${PAYMENT_PROVIDER:disabled}
  paygate:
    api-url: ${PAYGATE_API_URL:http://localhost:8081}
    checkout-url: ${PAYGATE_CHECKOUT_URL:http://localhost:4201/checkout}
    api-key: ${PAYGATE_API_KEY:marketplace-api-key-123456}
    merchant-code: ${PAYGATE_MERCHANT_CODE:MARKETPLACE_MP}
    return-url: ${PAYGATE_RETURN_URL:http://localhost:4200/orders/callback}
    cancel-url: ${PAYGATE_CANCEL_URL:http://localhost:4200/orders/callback}
    webhook:
      # The webhook endpoint is public (permitAll); this shared-secret signature is its only auth.
      # Keep true in real environments. Set false only if the PayGate build here does not yet send
      # the X-Paygate-Signature header, otherwise every webhook is rejected with 403.
      require-signature: ${PAYGATE_WEBHOOK_REQUIRE_SIGNATURE:true}
  review:
    # Days after delivery during which a customer may still review a purchase (G5).
    window-days: ${REVIEW_WINDOW_DAYS:90}
  features:
    review-qa: ${FEATURE_REVIEW_QA_ENABLED:true}
    promotions: ${FEATURE_PROMOTIONS_ENABLED:true}
    recommendations: ${FEATURE_RECOMMENDATIONS_ENABLED:true}
    journey-analytics: ${FEATURE_JOURNEY_ANALYTICS_ENABLED:true}
  analytics:
    cache-ttl: ${ANALYTICS_CACHE_TTL:5m}
  recommendation:
    best-seller-lookback: ${RECOMMENDATION_BEST_SELLER_LOOKBACK:30d}
    valid-order-statuses: ${RECOMMENDATION_VALID_ORDER_STATUSES:CONFIRMED,PROCESSING,SHIPPED,DELIVERED}
    co-viewed-lookback: ${RECOMMENDATION_CO_VIEWED_LOOKBACK:90d}
    min-co-viewed-occurrences: ${RECOMMENDATION_MIN_CO_VIEWED_OCCURRENCES:2}
    co-purchased-lookback: ${RECOMMENDATION_CO_PURCHASED_LOOKBACK:90d}
    min-co-purchased-occurrences: ${RECOMMENDATION_MIN_CO_PURCHASED_OCCURRENCES:2}
    similar-candidate-pool-size: ${RECOMMENDATION_SIMILAR_CANDIDATE_POOL_SIZE:500}
    similar-precompute-size: ${RECOMMENDATION_SIMILAR_PRECOMPUTE_SIZE:50}
  chat:
    enabled: ${FEATURE_CHAT_ASSISTANT_ENABLED:true}
    conversation-ttl: ${CHAT_CONVERSATION_TTL:24h}
    max-products: ${CHAT_MAX_PRODUCTS:6}
    max-history-messages: ${CHAT_MAX_HISTORY_MESSAGES:12}
    ai:
      enabled: ${CHAT_AI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${GEMINI_READ_TIMEOUT:8s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
