name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET is not configured for this repository"
            exit 1
          fi

      # Guard: fail fast on duplicate or old-style (non-timestamp) migration versions.
      - name: Check Flyway migration versions
        run: bash scripts/check-migration-versions.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build + unit tests
        run: ./mvnw -B -ntp test

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET is not configured for this repository"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Integration tests
        run: ./mvnw -B -ntp test-compile failsafe:integration-test failsafe:verify

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-reports
          path: |
            backend/target/failsafe-reports/**
            backend/target/surefire-reports/**

  frontend:
    name: Frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Production build
        run: npm run build
